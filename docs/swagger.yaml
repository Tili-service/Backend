            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Account login
      tags:
      - account
  /api/webhooks/stripe:
    post:
      consumes:
      - application/json
      description: Endpoint to receive and process Stripe webhook events, creating
        licences upon successful checkout sessions.
      parameters:
      - description: Raw Stripe webhook payload
        in: body
        name: body
        required: true
        schema:
