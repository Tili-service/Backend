definitions:
  account.Account:
    properties:
      account_id:
        type: integer
      created_at:
        type: string
      email:
        type: string
      name:
        type: string
    type: object
  account.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  account.RegistrationInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  account.UpdateAccountInput:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  catalog.catalog:
    properties:
      description:
        example: All items available for the winter 2026 season
        type: string
      name:
        example: Winter 2026 Collection
        type: string
    type: object
  catalog.catalogUpdate:
    properties:
      description:
        example: All items available for the winter 2026 season
        type: string
      name:
        example: Winter 2026 Collection
        type: string
    type: object
  categorie.Categorie:
    properties:
      categorie_id:
        example: 1
        type: integer
      type:
        example: Electronics
        type: string
    type: object
  item.Item:
    properties:
      categorie:
        $ref: '#/definitions/categorie.Categorie'
      categorie_id:
        example: 1
        type: integer
      item_id:
        example: 1
        type: integer
      name:
        example: Laptop Pro 15
        type: string
      price:
        example: 999.99
        type: number
      tax:
        example: 0.2
        type: number
      tax_amount:
        example: 199.99
        type: number
    type: object
  item.ItemUpdate:
    properties:
      categorie_id:
        example: 1
        type: integer
      name:
        example: Laptop Pro 15
        type: string
      price:
        example: 999.99
        type: number
      tax:
        example: 0.2
        type: number
    type: object
  license.CreatePaymentLinkInput:
    properties:
      offer:
        type: string
    required:
    - offer
    type: object
  license.Licence:
    properties:
      account_id:
        type: integer
      expiration:
        type: string
      is_active:
        type: boolean
      licence_id:
        type: string
      store:
        $ref: '#/definitions/store.Store'
    type: object
  license.PaymentLinkResponse:
    properties:
      url:
        type: string
    type: object
  license.UpdateLicenceInput:
    properties:
      is_active:
        type: boolean
      transaction:
        type: string
    type: object
  payementmethod.PayementMethod:
    properties:
      name:
        example: Credit Card
        type: string
      payement_method_id:
        example: 1
        type: integer
    type: object
  payementmethod.PayementMethodInput:
    properties:
      name:
        example: Credit Card
        type: string
    type: object
  profile.CreateProfileInput:
    properties:
      level_access:
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  profile.PinLoginInput:
    properties:
      pin:
        type: string
      store_id:
        type: integer
    required:
    - pin
    - store_id
    type: object
  profile.Profile:
    properties:
      is_active:
        type: boolean
      level_access:
        type: integer
      name:
        type: string
      profile_id:
        type: integer
      store_id:
        type: integer
    type: object
  profile.ProfileWithPin:
    properties:
      is_active:
        type: boolean
      level_access:
        type: integer
      name:
        type: string
      pin:
        type: string
      profile_id:
        type: integer
      store_id:
        type: integer
    type: object
  profile.updateProfileInput:
    properties:
      is_active:
        type: boolean
      level_access:
        type: integer
      name:
        type: string
      pin:
        type: string
    type: object
  sale.CreateSaleInput:
    properties:
      lines:
        items:
          $ref: '#/definitions/sale.SaleLine'
        minItems: 1
        type: array
      payement_method_id:
        type: integer
    required:
    - lines
    - payement_method_id
    type: object
  sale.Sale:
    properties:
      lines:
        items:
          $ref: '#/definitions/sale.SaleLine'
        type: array
      payement_method:
        $ref: '#/definitions/payementmethod.PayementMethod'
      payement_method_id:
        type: integer
      price:
        type: number
      sale_id:
        type: integer
      time_stamp:
        type: string
    type: object
  sale.SaleLine:
    properties:
      item_id:
        type: integer
      name:
        type: string
      quantity:
        minimum: 1
        type: integer
      tax_rate:
        type: number
      unit_price:
        type: number
    required:
    - item_id
    - quantity
    - unit_price
    type: object
  sale.UpdateSaleInput:
    properties:
      lines:
        items:
          $ref: '#/definitions/sale.SaleLine'
        minItems: 1
        type: array
      payement_method_id:
        type: integer
    type: object
  salehistory.SaleHistory:
    properties:
      changed_at:
        type: string
      changed_by_account_id:
        type: integer
      history_id:
        type: integer
      previous_lines:
        items:
          $ref: '#/definitions/salehistory.SaleLineSnapshot'
        type: array
      previous_payement_method_id:
        type: integer
      previous_price:
        type: number
      previous_time_stamp:
        type: string
      sale_id:
        type: integer
    type: object
  salehistory.SaleLineSnapshot:
    properties:
      item_id:
        type: integer
      name:
        type: string
      quantity:
        type: integer
      tax_rate:
        type: number
      unit_price:
        type: number
    type: object
  store.CreateStoreInput:
    properties:
      licence_id:
        type: string
      name:
        type: string
      numero_tva:
        type: string
      siret:
        type: string
    required:
    - licence_id
    - name
    type: object
  store.Store:
    properties:
      date_creation:
        type: string
      licence_id:
        type: string
      name:
        type: string
      numero_tva:
        type: string
      siret:
        type: string
      store_id:
        type: integer
    type: object
info:
  contact: {}
  title: Tili API
  version: "0.1"
paths:
  /account:
    delete:
      consumes:
      - application/json
      description: Deletes the currently authenticated account along with all licences,
        stores, and profiles.
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - AccountToken: []
      summary: Delete account
      tags:
      - account
    get:
      consumes:
      - application/json
      description: Retrieves the account information of the currently authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.Account'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - AccountToken: []
      summary: Get current account
      tags:
      - account
    post:
      consumes:
      - application/json
      description: Creates a new account. Returns the created account.
      parameters:
      - description: Account registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.RegistrationInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/account.Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register a new account
      tags:
      - account
    put:
      consumes:
      - application/json
      description: Updates the name and/or email of the currently authenticated account.
      parameters:
      - description: Account update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.UpdateAccountInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.Account'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - AccountToken: []
      summary: Update account
      tags:
      - account
  /account/login:
    post:
      consumes:
      - application/json
      description: Authenticates with email/password and returns an account JWT token
        along with the list of owned stores.
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/account.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
