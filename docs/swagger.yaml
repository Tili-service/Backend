        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Handle Stripe webhook
      tags:
      - licence
  /catalog:
    get:
      description: Retrieves the complete list of catalogs
      produces:
